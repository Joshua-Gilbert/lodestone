# gridlink settings.  Copy to ~/.config/gridlink/config.toml and edit.

[bridge]
port = "/dev/ttyUSB0"        # the Nano (CH340) on the Pi's USB
baud = 115200                # must match AR_SERIAL_SPEED in the AR488 firmware
address = 7                  # GPIB address of the bridge; CLAUDE /A:7 on the GRiD

[claude]
model = "opus"               # opus, sonnet, haiku, fable, or a full model id
max_tokens = 32000
web = true                   # web search and fetch
compact_at = 300000          # summarise the conversation past this many tokens
api_key_file = "~/.config/gridlink/api_key"   # one line: your Console API key
# extra_prompt = "Anything Claude should always know about your bench."

[grid]
app = "auto"                 # what CLAUDE gets without /T or /C: chat, term, or auto
                             # (chat when there is an API key, else Term)
user = "Joshua"
set_clock = true             # set the GRiD's clock from the Pi when it connects
workdir = "~/gridlink/work"  # Claude's scratch space on the Pi
memory_dir = "~/gridlink/memories"
sessions_dir = "~/gridlink/sessions"
bash_timeout = 180

[term]                       # CLAUDE /T: the real Claude Code on this Pi, on your subscription
command = "claude"           # sign in once with `claude` at the Pi's own terminal
dir = "~/grid"               # where it starts: put CLAUDE.md here; .mcp.json is kept up to date

[web]                        # CLAUDE /W: Firefox on this Pi, shown as text (gridfox)
# command = "/home/pi/gridlink/venv/bin/python -m gridfox"   # (the default: gridlink's own Python)
#   add a start page, or --images, --search URL%s

[permissions]
mode = "ask"                 # ask, edits (accept file edits), auto (ask nothing)

[plotter]                    # grid_plotter: the Tek 4662, through the Nano that translates HP-GL
address = 1                  # the Nano's GPIB address (GPIB_ADDRESS in gpib_hpgl_tek4662.ino, addressed mode)

[bus]                        # GPIB address = what is there (Claude sees this list)
1 = "Tek 4662 pen plotter (HP-GL, through its Nano; grid_plotter)"
2 = "Tek 11403 digitizing scope"
3 = "Tek 7854 oscilloscope"
6 = "Tek FG5010 function generator"
11 = "Tek SI5020 switch"
13 = "Tek PS5004 power supply"
16 = "Tek DM5120 DMM"
18 = "HP 8753D network analyzer"
28 = "Tek DM5010 DMM"
29 = "Tek DC5009 counter"
30 = "Tek PS5010 power supply"
