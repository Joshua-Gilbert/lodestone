# /etc/gpib-bridge/bridge.toml -- settings for gpib-bridged (the Pi side of the GPIB-Pico2 bridge).
# After a change:  sudo systemctl restart gpib-bridge

# GPIB primary address the bridge answers at (0..30).  It must not be used by any instrument on the bus,
# nor by the 1520 itself (21).  CLAUDE.COM looks for the Pi at 7 (CLAUDE /A:nn for another); THRUTEST
# defaults to 10, so run it as THRUTEST /A:7.
address = 7

# What answers the 1520:
#   "thrutest" - like the bench firmware: *IDN? -> the bench ID, anything else echoed.  A:\THRUTEST checks
#                the whole chain with it.  Start here.
#   "scpi"     - a small 488.2/SCPI instrument (*IDN?, SYST:TIME?, ECHO, PI:TEMP? ...), to build on
#   "/home/joshua/mylab.py:MyLab" - your own handler class (see gpibbridge/handlers/base.py)
handler = "thrutest"

# Serial port: "auto" finds the bridge (/dev/gpib-bridge from the udev rule, or any Pico).
port = "auto"

control_socket = "/run/gpib-bridge/ctl.sock"
log_level = "info"          # "debug" logs every message and address change

[handler_options]
# for the scpi handler, e.g.:
# idn = "PounceLab,GPIB-Pico2 Bridge,gpib-pi,1"
