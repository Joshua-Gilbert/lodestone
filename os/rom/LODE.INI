; Lodestone's own settings, burned into the ROM (R:\LODE.INI).  They are also
; the built-in defaults.  Changes made in System go in C:\LODE.INI (A:\ without
; the hard disk), read over these.  Hold Shift at start-up for the menu: 2
; starts once with these alone.
SPLASH=1
SAVER=5
TIDY=1
MDISK=256
GPIBIRQ=5
TEMP=M:\
; MULTITASK=1: a task's KB (64 without this).  CODE-P's prompt is a task:
; more for it here, and Claude's (CODE-A); Shift: all the memory
MTMEM=LCMD.COM:64,CLAUDE.COM:128
